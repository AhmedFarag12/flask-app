{% extends "base.html" %}
{% block content %}
  <h1>Edit Task</h1>
  <form method="post" class="add-form">
    <input type="text" name="title" value="{{ todo.title }}" maxlength="{{ title_max_length }}" required autofocus>
    <button type="submit">Save</button>
  </form>
  <p><a href="{{ url_for('main.index') }}" class="btn-link">← Back</a></p>
{% endblock %}
