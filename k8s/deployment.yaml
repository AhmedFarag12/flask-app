apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-todo
spec:
  # SQLite on a ReadWriteOnce volume supports only one pod. Recreate stops the
  # old pod before starting the new one so they never fight over the file.
  # To scale out, switch to PostgreSQL and use RollingUpdate with more replicas.
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: web
          # scripts/deploy.sh and the GitHub deploy workflow replace this tag.
          image: ghcr.io/OWNER/flask-todo:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: flask-todo-secret
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/instance
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flask-todo-data
        # Gunicorn needs a writable /tmp because the root filesystem is read-only.
        - name: tmp
          emptyDir: {}
