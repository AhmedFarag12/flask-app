# Apply everything with:  kubectl apply -k k8s
# The secret is NOT stored here; scripts/deploy.sh creates it from your .env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flask-todo

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/name: flask-todo
    includeSelectors: true
