name: Deploy

# Runs after CI succeeds on main, or manually from the Actions tab.
# Needs repository secrets:
#   KUBE_CONFIG  - kubeconfig file contents for the target cluster
#   SECRET_KEY   - the Flask SECRET_KEY for production
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy (commit sha); defaults to the selected branch's latest commit
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: azure/setup-kubectl@v4

      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          [ -n "$KUBE_CONFIG" ] || { echo "::error::KUBE_CONFIG secret is not set"; exit 1; }
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Write production env file
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          [ -n "$SECRET_KEY" ] || { echo "::error::SECRET_KEY secret is not set"; exit 1; }
          umask 077
          printf 'SECRET_KEY=%s\nDATABASE_URL=sqlite:///todos.db\n' "$SECRET_KEY" > "$RUNNER_TEMP/prod.env"

      - name: Deploy
        env:
          ENV_FILE: ${{ runner.temp }}/prod.env
          TAG: ${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
        run: bash scripts/deploy.sh "ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
